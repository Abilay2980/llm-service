[project]
name = "llm-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abilay", email = "gnomik2984@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.4.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "ollama>=0.6.2",
    "openai>=3.8.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.0",
    "sentence-transformers>=6.0.1",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
llm-service = "llm_service:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "ipykernel>=7.3.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
